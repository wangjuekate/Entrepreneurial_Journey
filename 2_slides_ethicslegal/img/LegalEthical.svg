<g data-beat="7"><text x="780.00" y="740.45" font-size="18" fill="#1e1e1e" text-anchor="middle"><tspan x="780.00">1. Could a regulator charge me for this?</tspan><tspan x="780.00" dy="22.50">2. If not — would I be comfortable if the person</tspan><tspan x="780.00" dy="22.50">affected could see exactly what I did?</tspan></text></g>
<g data-beat="7"><text x="430.00" y="830.40" font-size="16" fill="#4b5563">Answer them separately, and in that order.</text></g>
