<g data-beat="6"><text x="430.00" y="629.30" font-size="17" fill="#4b5563"><tspan x="430.00">THE GREY ZONE — crypto · AI · early eBay · gig work.</tspan><tspan x="430.00" dy="21.25">New businesses routinely operate where the law has not arrived yet.</tspan><tspan x="430.00" dy="21.25">That is not automatically wrong. It is the normal condition of innovation.</tspan></text></g>
