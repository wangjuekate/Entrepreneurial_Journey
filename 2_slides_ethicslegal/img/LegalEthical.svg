<g data-beat="4"><text x="602.50" y="238.43" font-size="17" fill="#1e1e1e" text-anchor="middle"><tspan x="602.50">Ethical but NOT legal</tspan><tspan x="602.50" dy="21.25"></tspan><tspan x="602.50" dy="21.25">civil disobedience</tspan></text></g>
