<svg xmlns="http://www.w3.org/2000/svg" viewBox="36.0 16.0 1168.0 768.0" width="1168" height="768" font-family="Segoe Print, Comic Sans MS, Bradley Hand, cursive">
<defs><marker id="ah-SocialEnterprise" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs>
<g data-beat="1"><text x="210.00" y="57.95" font-size="18" fill="#4b5563" text-anchor="middle">MISSION</text></g>
<g data-beat="1"><text x="1030.00" y="57.95" font-size="18" fill="#4b5563" text-anchor="middle">MARGIN</text></g>
