<g data-beat="1"><rect x="60.00" y="120.00" width="300.00" height="96.00" rx="16.0" ry="16.0" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/></g>
<g data-beat="1"><text x="210.00" y="161.35" font-size="19" fill="#1e1e1e" text-anchor="middle"><tspan x="210.00">NONPROFIT</tspan><tspan x="210.00" dy="23.75">community welfare</tspan></text></g>
<g data-beat="2"><path d="M 210.00,220.00 L 210.00,254.00" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-SocialEnterprise)"/></g>
<g data-beat="2"><text x="210.00" y="277.68" font-size="17" fill="#4b5563" text-anchor="middle">funded by donations</text></g>
<g data-beat="3"><text x="210.00" y="313.68" font-size="17" fill="#4b5563" text-anchor="middle">mission is the purpose</text></g>
<g data-beat="1"><rect x="470.00" y="120.00" width="300.00" height="96.00" rx="16.0" ry="16.0" fill="#e6fffa" stroke="#0f766e" stroke-width="2"/></g>
<g data-beat="1"><text x="620.00" y="161.35" font-size="19" fill="#1e1e1e" text-anchor="middle"><tspan x="620.00">SOCIAL ENTERPRISE</tspan><tspan x="620.00" dy="23.75">profit + welfare</tspan></text></g>
<g data-beat="2"><path d="M 620.00,220.00 L 620.00,254.00" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-SocialEnterprise)"/></g>
<g data-beat="2"><text x="620.00" y="277.68" font-size="17" fill="#4b5563" text-anchor="middle">funded by customers</text></g>
<g data-beat="3"><text x="620.00" y="313.68" font-size="17" fill="#4b5563" text-anchor="middle">mission is in the model</text></g>
<g data-beat="1"><rect x="880.00" y="120.00" width="300.00" height="96.00" rx="16.0" ry="16.0" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/></g>
<g data-beat="1"><text x="1030.00" y="161.35" font-size="19" fill="#1e1e1e" text-anchor="middle"><tspan x="1030.00">CORPORATION</tspan><tspan x="1030.00" dy="23.75">profit</tspan></text></g>
<g data-beat="2"><path d="M 1030.00,220.00 L 1030.00,254.00" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-SocialEnterprise)"/></g>
<g data-beat="2"><text x="1030.00" y="277.68" font-size="17" fill="#4b5563" text-anchor="middle">funded by customers</text></g>
<g data-beat="3"><text x="1030.00" y="313.68" font-size="17" fill="#4b5563" text-anchor="middle">mission is a department</text></g>
<g data-beat="4"><text x="620.00" y="367.95" font-size="18" fill="#b45309" text-anchor="middle">The axis tells you where a company sits. This tells you whether it survives.</text></g>
<g data-beat="4"><path d="M 620.00,384.00 L 320.00,428.00" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-SocialEnterprise)"/></g>
<g data-beat="4"><path d="M 620.00,384.00 L 920.00,428.00" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-SocialEnterprise)"/></g>
<g data-beat="4"><rect x="130.00" y="434.00" width="380.00" height="118.00" rx="16.0" ry="16.0" fill="#e6fffa" stroke="#0f766e" stroke-width="2"/></g>
<g data-beat="4"><text x="320.00" y="455.18" font-size="17" fill="#1e1e1e" text-anchor="middle"><tspan x="320.00">REINFORCE</tspan><tspan x="320.00" dy="21.25"></tspan><tspan x="320.00" dy="21.25">Every sale funds the mission</tspan><tspan x="320.00" dy="21.25">automatically. More mission makes</tspan><tspan x="320.00" dy="21.25">the product more attractive.</tspan></text></g>
<g data-beat="4"><rect x="730.00" y="434.00" width="380.00" height="118.00" rx="16.0" ry="16.0" fill="#fff4e6" stroke="#b45309" stroke-width="2"/></g>
<g data-beat="4"><text x="920.00" y="455.18" font-size="17" fill="#1e1e1e" text-anchor="middle"><tspan x="920.00">WORK AGAINST</tspan><tspan x="920.00" dy="21.25"></tspan><tspan x="920.00" dy="21.25">The mission is funded from what is</tspan><tspan x="920.00" dy="21.25">left over. Every dollar of mission is</tspan><tspan x="920.00" dy="21.25">visibly a dollar off the bottom line.</tspan></text></g>
<g data-beat="5"><text x="620.00" y="597.95" font-size="18" fill="#4b5563" text-anchor="middle">Then comes a bad year.</text></g>
<g data-beat="5"><path d="M 320.00,612.00 L 320.00,648.00" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-SocialEnterprise)"/></g>
<g data-beat="5"><path d="M 920.00,612.00 L 920.00,648.00" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-SocialEnterprise)"/></g>
<g data-beat="5"><text x="320.00" y="675.70" font-size="18" fill="#0f766e" text-anchor="middle"><tspan x="320.00">The mission survives it —</tspan><tspan x="320.00" dy="22.50">the loop closes.</tspan></text></g>
<g data-beat="5"><text x="920.00" y="686.95" font-size="18" fill="#b45309" text-anchor="middle">The mission is the first thing cut.</text></g>
<g data-beat="5"><text x="620.00" y="749.40" font-size="16" fill="#4b5563" text-anchor="middle">Two companies at the identical point on the axis can be on opposite sides of this question.</text></g>
</svg>