<svg xmlns="http://www.w3.org/2000/svg" viewBox="36.0 16.0 1128.0 856.0" width="1128" height="856" font-family="Segoe Print, Comic Sans MS, Bradley Hand, cursive">
<defs><marker id="ah-Acquisition_Value" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs>
<g data-beat="1"><text x="60.00" y="57.10" font-size="19" fill="#0f766e">PART ONE — read what you bought</text></g>
<g data-beat="1"><rect x="60.00" y="86.00" width="560.00" height="66.00" rx="16.0" ry="16.0" fill="#fff4e6" stroke="#b45309" stroke-width="2"/></g>
<g data-beat="1"><text x="340.00" y="125.05" font-size="22" fill="#1e1e1e" text-anchor="middle">THE PRICE YOU PAID</text></g>
<g data-beat="1"><text x="340.00" y="175.40" font-size="16" fill="#4b5563" text-anchor="middle">the accountants&#x27; autopsy: assign it to everything they can identify</text></g>
<g data-beat="2"><rect x="60.00" y="196.00" width="560.00" height="64.00" rx="16.0" ry="16.0" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/></g>
<g data-beat="2"><text x="340.00" y="233.22" font-size="19" fill="#1e1e1e" text-anchor="middle">cash and investments</text></g>
<g data-beat="2"><text x="634.00" y="232.68" font-size="17" fill="#4b5563">you bought back your own money</text></g>
<g data-beat="3"><rect x="60.00" y="268.00" width="560.00" height="92.00" rx="16.0" ry="16.0" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/></g>
<g data-beat="3"><text x="340.00" y="307.35" font-size="19" fill="#1e1e1e" text-anchor="middle"><tspan x="340.00">buildings, equipment,</tspan><tspan x="340.00" dy="23.75">patents, film costs</tspan></text></g>
<g data-beat="3"><text x="634.00" y="318.68" font-size="17" fill="#4b5563">still yours if everyone quits</text></g>
<g data-beat="4"><rect x="60.00" y="368.00" width="560.00" height="84.00" rx="16.0" ry="16.0" fill="#e6fffa" stroke="#0f766e" stroke-width="2"/></g>
<g data-beat="4"><text x="340.00" y="415.23" font-size="19" fill="#1e1e1e" text-anchor="middle">GOODWILL</text></g>
<g data-beat="4"><text x="634.00" y="414.68" font-size="17" fill="#4b5563">walks out of the car park at 6pm</text></g>
<g data-beat="4"><text x="340.00" y="483.68" font-size="17" fill="#b45309" text-anchor="middle">Look at that ratio and you know what kind of deal you just did.</text></g>
<g data-beat="5"><text x="60.00" y="543.10" font-size="19" fill="#0f766e">PART TWO — the ladder tells you what to do about it</text></g>
<g data-beat="5"><rect x="60.00" y="572.00" width="340.00" height="140.00" rx="16.0" ry="16.0" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/></g>
<g data-beat="5"><text x="230.00" y="606.40" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="230.00">ABSORB</tspan><tspan x="230.00" dy="20.00"></tspan><tspan x="230.00" dy="20.00">value is in assets and scale</tspan><tspan x="230.00" dy="20.00">fold it in, cut duplication,</tspan><tspan x="230.00" dy="20.00">bank the savings</tspan></text></g>
<g data-beat="5"><rect x="430.00" y="572.00" width="340.00" height="140.00" rx="16.0" ry="16.0" fill="#fff4e6" stroke="#b45309" stroke-width="2"/></g>
<g data-beat="5"><text x="600.00" y="606.40" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="600.00">SYMBIOSIS</tspan><tspan x="600.00" dy="20.00"></tspan><tspan x="600.00" dy="20.00">value is in both</tspan><tspan x="600.00" dy="20.00">keep them separate, share</tspan><tspan x="600.00" dy="20.00">deliberately, both directions</tspan></text></g>
<g data-beat="5"><rect x="800.00" y="572.00" width="340.00" height="140.00" rx="16.0" ry="16.0" fill="#e6fffa" stroke="#0f766e" stroke-width="2"/></g>
<g data-beat="5"><text x="970.00" y="606.40" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="970.00">PRESERVE</tspan><tspan x="970.00" dy="20.00"></tspan><tspan x="970.00" dy="20.00">value is in people and</tspan><tspan x="970.00" dy="20.00">how they work</tspan><tspan x="970.00" dy="20.00">change as little as possible</tspan></text></g>
<g data-beat="5"><path d="M 60.00,728.00 L 1140.00,728.00" fill="none" stroke="#4b5563" stroke-width="2" stroke-dasharray="8 6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g data-beat="5"><text x="230.00" y="753.67" font-size="17" fill="#4b5563" text-anchor="middle">LOW goodwill  →  absorb</text></g>
<g data-beat="5"><text x="970.00" y="753.67" font-size="17" fill="#4b5563" text-anchor="middle">HIGH goodwill  →  preserve</text></g>
<g data-beat="6"><rect x="60.00" y="782.00" width="1080.00" height="66.00" rx="16.0" ry="16.0" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/></g>
<g data-beat="6"><text x="600.00" y="808.35" font-size="19" fill="#1e1e1e" text-anchor="middle"><tspan x="600.00">The deals where the synergies look biggest are exactly the deals</tspan><tspan x="600.00" dy="23.75">where capturing them destroys what you bought.</tspan></text></g>
</svg>