<svg xmlns="http://www.w3.org/2000/svg" viewBox="206.0 -6.0 1028.0 764.5" width="1028" height="764" font-family="Segoe Print, Comic Sans MS, Bradley Hand, cursive">
<defs><marker id="ah-Risk_Return" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs>
<g data-beat="1"><path d="M 230.00,620.00 L 1180.00,620.00" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-Risk_Return)"/></g>
<g data-beat="1"><path d="M 230.00,620.00 L 230.00,80.00" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-Risk_Return)"/></g>
<g data-beat="1"><text x="250.00" y="67.30" font-size="17" fill="#4b5563">RETURN — money, fulfilment, the dent you leave</text></g>
<g data-beat="1"><text x="620.00" y="651.30" font-size="17" fill="#4b5563">TOTAL RISK BORNE</text></g>
<g data-beat="1"><text x="620.00" y="674.40" font-size="16" fill="#4b5563"><tspan x="620.00">four risks stacked, not one:</tspan><tspan x="620.00" dy="20.00">financial · career · family · mental</tspan></text></g>
<g data-beat="2"><ellipse cx="850.00" cy="500.00" rx="100.00" ry="45.00" fill="#fff4e6" stroke="#b45309" stroke-width="2"/></g>
<g data-beat="2"><text x="850.00" y="494.05" font-size="17" fill="#1e1e1e" text-anchor="middle"><tspan x="850.00">A — high risk,</tspan><tspan x="850.00" dy="21.25">low return</tspan></text></g>
<g data-beat="2"><text x="850.00" y="571.75" font-size="15" fill="#4b5563" text-anchor="middle"><tspan x="850.00">Most ventures live here. Not failure —</tspan><tspan x="850.00" dy="18.75">the middle of the ride. WeWork 2021.</tspan></text></g>
<g data-beat="3"><ellipse cx="430.00" cy="210.00" rx="100.00" ry="45.00" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/></g>
<g data-beat="3"><text x="430.00" y="204.05" font-size="17" fill="#1e1e1e" text-anchor="middle"><tspan x="430.00">B — low risk,</tspan><tspan x="430.00" dy="21.25">high return</tspan></text></g>
<g data-beat="3"><text x="430.00" y="281.75" font-size="15" fill="#4b5563" text-anchor="middle"><tspan x="430.00">Everyone thinks they are aiming here.</tspan><tspan x="430.00" dy="18.75">Almost nobody lands here.</tspan></text></g>
<g data-beat="4"><ellipse cx="960.00" cy="190.00" rx="100.00" ry="45.00" fill="#e6fffa" stroke="#0f766e" stroke-width="2"/></g>
<g data-beat="4"><text x="960.00" y="184.05" font-size="17" fill="#1e1e1e" text-anchor="middle"><tspan x="960.00">C — high risk,</tspan><tspan x="960.00" dy="21.25">high return</tspan></text></g>
<g data-beat="4"><text x="960.00" y="271.12" font-size="15" fill="#4b5563" text-anchor="middle">The founder who got off at the top.</text></g>
<g data-beat="5"><text x="250.00" y="108.20" font-size="18" fill="#0f766e">no ceiling — your upside is capped by your ambition</text></g>
<g data-beat="5"><path d="M 230.00,700.00 L 1180.00,700.00" fill="none" stroke="#c92a2a" stroke-width="2" stroke-dasharray="8 6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g data-beat="5"><text x="240.00" y="728.20" font-size="18" fill="#c92a2a">the floor is your signature — you can lose more than you put in</text></g>
<g data-beat="5"><path d="M 955.00,500.00 L 1120.00,500.00 L 1120.00,696.00" fill="none" stroke="#c92a2a" stroke-width="2" stroke-dasharray="8 6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-Risk_Return)"/></g>
<g data-beat="5"><text x="270.00" y="345.30" font-size="17" fill="#4b5563"><tspan x="270.00">Neumann and his 2,000 employees rode the SAME</tspan><tspan x="270.00" dy="21.25">curve. They just sat at different points on the risk</tspan><tspan x="270.00" dy="21.25">axis — he had a parachute, they had stock.</tspan></text></g>
<g data-beat="6"><rect x="710.00" y="18.00" width="500.00" height="70.00" rx="16.0" ry="16.0" fill="#e6fffa" stroke="#0f766e" stroke-width="2"/></g>
<g data-beat="6"><text x="960.00" y="46.70" font-size="18" fill="#1e1e1e" text-anchor="middle"><tspan x="960.00">Which axis does this move me on —</tspan><tspan x="960.00" dy="22.50">and can I survive the move if I&#x27;m wrong?</tspan></text></g>
</svg>