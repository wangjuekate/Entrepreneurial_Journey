<svg xmlns="http://www.w3.org/2000/svg" viewBox="16.0 76.0 1238.0 724.0" width="1238" height="724" font-family="Segoe Print, Comic Sans MS, Bradley Hand, cursive">
<defs><marker id="ah-CreativeLoop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs>
<g data-beat="1"><rect x="80.00" y="100.00" width="320.00" height="110.00" rx="16.0" ry="16.0" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/></g>
<g data-beat="1"><text x="240.00" y="148.00" font-size="20" fill="#1e1e1e" text-anchor="middle"><tspan x="240.00">DEFINE</tspan><tspan x="240.00" dy="25.00">the problem</tspan></text></g>
<g data-beat="1"><text x="240.00" y="246.05" font-size="17" fill="#4b5563" text-anchor="middle"><tspan x="240.00">What is the real</tspan><tspan x="240.00" dy="21.25">question here?</tspan></text></g>
<g data-beat="2"><rect x="470.00" y="100.00" width="320.00" height="110.00" rx="16.0" ry="16.0" fill="#e6fffa" stroke="#0f766e" stroke-width="2"/></g>
<g data-beat="2"><text x="630.00" y="148.00" font-size="20" fill="#1e1e1e" text-anchor="middle"><tspan x="630.00">IDEATE</tspan><tspan x="630.00" dy="25.00">(diverge)</tspan></text></g>
<g data-beat="2"><text x="630.00" y="246.05" font-size="17" fill="#4b5563" text-anchor="middle"><tspan x="630.00">Many options,</tspan><tspan x="630.00" dy="21.25">no judging yet</tspan></text></g>
<g data-beat="3"><rect x="860.00" y="100.00" width="320.00" height="110.00" rx="16.0" ry="16.0" fill="#fff4e6" stroke="#b45309" stroke-width="2"/></g>
<g data-beat="3"><text x="1020.00" y="148.00" font-size="20" fill="#1e1e1e" text-anchor="middle"><tspan x="1020.00">PROTOTYPE &amp; TEST</tspan><tspan x="1020.00" dy="25.00">(converge)</tspan></text></g>
<g data-beat="3"><text x="1020.00" y="246.05" font-size="17" fill="#4b5563" text-anchor="middle"><tspan x="1020.00">The cheapest test</tspan><tspan x="1020.00" dy="21.25">that could FAIL</tspan></text></g>
<g data-beat="2"><path d="M 404.00,155.00 L 466.00,155.00" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-CreativeLoop)"/></g>
<g data-beat="3"><path d="M 794.00,155.00 L 856.00,155.00" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-CreativeLoop)"/></g>
<g data-beat="4"><path d="M 1180.00,155.00 L 1220.00,155.00 L 1220.00,314.00 L 40.00,314.00 L 40.00,155.00 L 76.00,155.00" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-CreativeLoop)"/></g>
<g data-beat="4"><text x="630.00" y="307.95" font-size="18" fill="#0f766e" text-anchor="middle">redefine the problem, go again</text></g>
<g data-beat="5"><rect x="80.00" y="400.00" width="550.00" height="158.00" rx="16.0" ry="16.0" fill="#e6fffa" stroke="#0f766e" stroke-width="2"/></g>
<g data-beat="5"><text x="355.00" y="438.95" font-size="18" fill="#1e1e1e" text-anchor="middle"><tspan x="355.00">DIVERGE</tspan><tspan x="355.00" dy="22.50"></tspan><tspan x="355.00" dy="22.50">generating options</tspan><tspan x="355.00" dy="22.50">&quot;yes, and — what else?&quot;</tspan><tspan x="355.00" dy="22.50">fails by never stopping · feels wasteful</tspan></text></g>
<g data-beat="5"><rect x="680.00" y="400.00" width="550.00" height="158.00" rx="16.0" ry="16.0" fill="#fff4e6" stroke="#b45309" stroke-width="2"/></g>
<g data-beat="5"><text x="955.00" y="438.95" font-size="18" fill="#1e1e1e" text-anchor="middle"><tspan x="955.00">CONVERGE</tspan><tspan x="955.00" dy="22.50"></tspan><tspan x="955.00" dy="22.50">choosing between them</tspan><tspan x="955.00" dy="22.50">&quot;which of these could be wrong?&quot;</tspan><tspan x="955.00" dy="22.50">fails by starting too early · feels decisive</tspan></text></g>
<g data-beat="5"><path d="M 655.00,410.00 L 655.00,548.00" fill="none" stroke="#4b5563" stroke-width="2" stroke-dasharray="8 6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g data-beat="5"><text x="655.00" y="598.05" font-size="17" fill="#4b5563" text-anchor="middle"><tspan x="655.00">Almost every bad meeting you will sit in is a room trying to do both at once.</tspan><tspan x="655.00" dy="21.25">Say out loud which one you are doing: &quot;we&#x27;re still diverging — hold the objections for ten minutes.&quot;</tspan></text></g>
<g data-beat="6"><rect x="190.00" y="656.00" width="930.00" height="120.00" rx="16.0" ry="16.0" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/></g>
<g data-beat="6"><text x="655.00" y="670.40" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="655.00">The most expensive mistake in business is treating a prototype like a product.</tspan><tspan x="655.00" dy="20.00"></tspan><tspan x="655.00" dy="20.00">A prototype is funded for LEARNING and judged on what you found out.</tspan><tspan x="655.00" dy="20.00">A product is funded for REVENUE and judged on money. Swap them and you either</tspan><tspan x="655.00" dy="20.00">cancel an experiment for missing a target it never had, or bet the company on</tspan><tspan x="655.00" dy="20.00">something nobody tested. Both look, from the inside, exactly like being decisive.</tspan></text></g>
</svg>