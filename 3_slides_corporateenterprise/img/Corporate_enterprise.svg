<svg xmlns="http://www.w3.org/2000/svg" viewBox="16.0 72.0 1348.0 716.0" width="1348" height="716" font-family="Segoe Print, Comic Sans MS, Bradley Hand, cursive">
<defs><marker id="ah-Corporate_enterprise" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs>
<g data-beat="1"><text x="60.00" y="112.20" font-size="18" fill="#0f766e">EXTERNAL TRIGGER</text></g>
<g data-beat="1"><rect x="60.00" y="140.00" width="210.00" height="54.00" rx="13.5" ry="13.5" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/></g>
<g data-beat="1"><text x="165.00" y="171.68" font-size="17" fill="#1e1e1e" text-anchor="middle">new technology</text></g>
<g data-beat="1"><rect x="60.00" y="208.00" width="210.00" height="54.00" rx="13.5" ry="13.5" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/></g>
<g data-beat="1"><text x="165.00" y="239.68" font-size="17" fill="#1e1e1e" text-anchor="middle">a new entrant</text></g>
<g data-beat="1"><rect x="60.00" y="276.00" width="210.00" height="54.00" rx="13.5" ry="13.5" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/></g>
<g data-beat="1"><text x="165.00" y="307.68" font-size="17" fill="#1e1e1e" text-anchor="middle">regulation</text></g>
<g data-beat="1"><rect x="60.00" y="344.00" width="210.00" height="54.00" rx="13.5" ry="13.5" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/></g>
<g data-beat="1"><text x="165.00" y="375.68" font-size="17" fill="#1e1e1e" text-anchor="middle">a customer shift</text></g>
<g data-beat="1"><text x="165.00" y="444.40" font-size="16" fill="#4b5563" text-anchor="middle"><tspan x="165.00">Everybody sees the same triggers.</tspan><tspan x="165.00" dy="20.00">Amazon&#x27;s competitors also noticed</tspan><tspan x="165.00" dy="20.00">servers were getting cheap.</tspan><tspan x="165.00" dy="20.00">Triggers are free — they are not</tspan><tspan x="165.00" dy="20.00">an advantage.</tspan></text></g>
<g data-beat="2"><path d="M 274.00,167.00 L 344.00,190.00" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-Corporate_enterprise)"/></g>
<g data-beat="2"><path d="M 274.00,235.00 L 344.00,250.00" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-Corporate_enterprise)"/></g>
<g data-beat="2"><path d="M 274.00,303.00 L 344.00,310.00" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-Corporate_enterprise)"/></g>
<g data-beat="2"><path d="M 274.00,371.00 L 344.00,370.00" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-Corporate_enterprise)"/></g>
<g data-beat="2"><text x="350.00" y="112.20" font-size="18" fill="#0f766e">INTERNAL CONDITIONS</text></g>
<g data-beat="2"><rect x="350.00" y="130.00" width="330.00" height="340.00" rx="16.0" ry="16.0" fill="#e6fffa" stroke="#0f766e" stroke-width="2"/></g>
<g data-beat="2"><text x="515.00" y="209.05" font-size="17" fill="#1e1e1e" text-anchor="middle"><tspan x="515.00">· management support</tspan><tspan x="515.00" dy="21.25"></tspan><tspan x="515.00" dy="21.25">· work discretion</tspan><tspan x="515.00" dy="21.25"></tspan><tspan x="515.00" dy="21.25">· rewards &amp; recognition</tspan><tspan x="515.00" dy="21.25"></tspan><tspan x="515.00" dy="21.25">· time availability</tspan><tspan x="515.00" dy="21.25"></tspan><tspan x="515.00" dy="21.25">· organizational boundaries</tspan><tspan x="515.00" dy="21.25">   (permission to take risk)</tspan></text></g>
<g data-beat="2"><text x="515.00" y="496.40" font-size="16" fill="#b45309" text-anchor="middle"><tspan x="515.00">Notice what is NOT on that list: money.</tspan><tspan x="515.00" dy="20.00">Amazon had $1.18 BILLION of free cash flow</tspan><tspan x="515.00" dy="20.00">in 2007. Permission, time and cover were</tspan><tspan x="515.00" dy="20.00">the binding constraint — never cash.</tspan></text></g>
<g data-beat="3"><path d="M 684.00,300.00 L 756.00,300.00" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-Corporate_enterprise)"/></g>
<g data-beat="3"><rect x="760.00" y="240.00" width="250.00" height="120.00" rx="16.0" ry="16.0" fill="#fff4e6" stroke="#b45309" stroke-width="2"/></g>
<g data-beat="3"><text x="885.00" y="292.30" font-size="22" fill="#1e1e1e" text-anchor="middle"><tspan x="885.00">MIDDLE</tspan><tspan x="885.00" dy="27.50">MANAGER</tspan></text></g>
<g data-beat="3"><text x="885.00" y="399.40" font-size="16" fill="#4b5563" text-anchor="middle"><tspan x="885.00">Not the CEO. Senior enough to</tspan><tspan x="885.00" dy="20.00">allocate people, junior enough to be</tspan><tspan x="885.00" dy="20.00">measured on this quarter — so the</tspan><tspan x="885.00" dy="20.00">venture&#x27;s only advocate is also the</tspan><tspan x="885.00" dy="20.00">person who pays for it.</tspan></text></g>
<g data-beat="4"><path d="M 1014.00,300.00 L 1086.00,300.00" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-Corporate_enterprise)"/></g>
<g data-beat="4"><rect x="1090.00" y="240.00" width="250.00" height="120.00" rx="16.0" ry="16.0" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/></g>
<g data-beat="4"><text x="1215.00" y="282.45" font-size="18" fill="#1e1e1e" text-anchor="middle"><tspan x="1215.00">individual &amp;</tspan><tspan x="1215.00" dy="22.50">organizational</tspan><tspan x="1215.00" dy="22.50">outcomes</tspan></text></g>
<g data-beat="5"><path d="M 1215.00,364.00 L 1215.00,604.00 L 710.00,604.00" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-Corporate_enterprise)"/></g>
<g data-beat="5"><rect x="350.00" y="628.00" width="700.00" height="76.00" rx="16.0" ry="16.0" fill="#fff4e6" stroke="#b45309" stroke-width="2"/></g>
<g data-beat="5"><text x="700.00" y="659.70" font-size="18" fill="#1e1e1e" text-anchor="middle"><tspan x="700.00">Benchmark TWICE — against competitors, AND against our own last few years.</tspan><tspan x="700.00" dy="22.50">Drop either one and you get a confidently wrong answer.</tspan></text></g>
<g data-beat="5"><text x="700.00" y="735.40" font-size="16" fill="#4b5563" text-anchor="middle"><tspan x="700.00">AWS year one: operating income FELL from $432M to $389M while technology spend rose</tspan><tspan x="700.00" dy="20.00">from $451M to $662M. The cost hits the parent a full year before the benefit does.</tspan></text></g>
</svg>